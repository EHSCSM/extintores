<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impresión de QRs - Riesgos Cero</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f1f5f9; 
            margin: 0; 
            padding: 20px; 
        }
        /* Estilos específicos para la hoja de papel */
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .grid-qrs { page-break-inside: auto; }
            .etiqueta { page-break-inside: avoid; }
        }
        
        .grid-qrs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .etiqueta {
            background: white;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .qr-container { margin: 10px 0; }
        .qr-container img { margin: 0 auto; }
        
        .folio { font-size: 16px; font-weight: 900; color: #0f172a; margin: 0; }
        .info { font-size: 10px; color: #64748b; margin-top: 5px; font-weight: 700; text-transform: uppercase; }
        
        /* Botonera superior */
        .header-bar {
            max-width: 1000px; margin: 0 auto 20px auto;
            background: #1e3a8a; color: white; padding: 15px 20px;
            border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .btn-imprimir {
            background: #10b981; border: none; padding: 10px 20px;
            color: white; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        .btn-imprimir:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="header-bar no-print">
        <div>
            <h2 style="margin:0; font-size:18px;">Generador de Etiquetas QR</h2>
            <p style="margin:0; font-size:12px; color:#93c5fd;">Activos registrados de la empresa</p>
        </div>
        <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir QRs</button>
    </div>

    <div id="contenedor-qrs" class="grid-qrs">
        <p style="text-align: center; grid-column: 1 / -1;">Cargando base de datos...</p>
    </div>

    <script>
        async function generarQRs() {
            const empresaId = localStorage.getItem('empresa_id');
            if (!empresaId) {
                document.getElementById('contenedor-qrs').innerHTML = '<p style="color:red; text-align:center;">Error de sesión.</p>';
                return;
            }

            try {
                // Usamos el endpoint que ya existía para el inventario móvil
                const respuesta = await fetch(`../api/obtener_inventario.php?empresa_id=${empresaId}`);
                const data = await respuesta.json();
                const contenedor = document.getElementById('contenedor-qrs');
                
                contenedor.innerHTML = '';

                if (data.error || data.datos.length === 0) {
                    contenedor.innerHTML = '<p style="text-align:center; grid-column: 1 / -1;">No hay extintores registrados.</p>';
                    return;
                }

                data.datos.forEach(ext => {
                    // Crear el cuadro de la etiqueta
                    const divEtiqueta = document.createElement('div');
                    divEtiqueta.className = 'etiqueta';
                    
                    const pFolio = document.createElement('p');
                    pFolio.className = 'folio';
                    pFolio.innerText = ext.codigo_qr;
                    
                    // Contenedor donde se dibujará el código
                    const divQr = document.createElement('div');
                    divQr.className = 'qr-container';
                    
                    const pInfo = document.createElement('p');
                    pInfo.className = 'info';
                    pInfo.innerText = `${ext.tipo_agente} - ${ext.capacidad}`;

                    divEtiqueta.appendChild(pFolio);
                    divEtiqueta.appendChild(divQr);
                    divEtiqueta.appendChild(pInfo);
                    contenedor.appendChild(divEtiqueta);

                    // Generar el QR usando la librería
                    new QRCode(divQr, {
                        text: ext.codigo_qr,
                        width: 120,
                        height: 120,
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                });

            } catch (error) {
                document.getElementById('contenedor-qrs').innerHTML = '<p style="color:red;">Error de conexión.</p>';
            }
        }

        // Arrancar al cargar la página
        window.onload = generarQRs;
    </script>
</body>
</html>
