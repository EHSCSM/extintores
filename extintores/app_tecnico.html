<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auditoría - Riesgos Cero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-20">

    <!-- ==========================================
         VISTA 1: DASHBOARD PRINCIPAL
         ========================================== -->
    <main id="vista-principal" class="p-4">
        
        <div class="text-center mb-6 mt-4">
            <h2 id="lbl-empresa" class="font-black text-xl text-slate-800 tracking-tight">Cargando misión...</h2>
            <p id="lbl-direccion" class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Conectando</p>
        </div>

        <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100 mb-6">
            
            <div class="grid grid-cols-2 gap-3 mb-8">
                <div class="bg-[#1a1f33] rounded-2xl p-4 text-center shadow-md">
                    <p class="text-[9px] font-black text-[#10b981] uppercase tracking-widest mb-1">Avance de Planta</p>
                    <!-- Aquí el ID clave para inyectar los números -->
                    <h3 id="lbl-avance-planta" class="text-2xl font-black text-white leading-none mb-1">0 / 0</h3>
                    <p class="text-[8px] text-slate-400">Equipos Auditados</p>
                </div>
                <div class="bg-[#f59e0b] rounded-2xl p-4 text-center shadow-md">
                    <p class="text-[9px] font-black text-black uppercase tracking-widest mb-1">Por cargar a taller</p>
                    <!-- Aquí el otro ID clave -->
                    <h3 id="lbl-avance-taller" class="text-2xl font-black text-black leading-none mb-1 flex items-center justify-center gap-2">
                        <i class="ph-bold ph-truck"></i> 0
                    </h3>
                    <p class="text-[8px] text-black/70 font-bold">Equipos Rechazados</p>
                </div>
            </div>

            <div class="text-center">
                <h3 class="font-black text-lg text-slate-900 mb-4">Auditoría de Activos</h3>
                
                <button onclick="iniciarEscaner()" class="w-full bg-[#203a85] text-white font-black py-4 rounded-2xl hover:bg-blue-900 active:scale-95 transition-all shadow-md flex justify-center items-center gap-3 mb-4">
                    <i class="ph-bold ph-corners-out text-2xl"></i> ESCANEAR ACTIVO
                </button>

                <div class="flex gap-2">
                    <input type="text" id="input-folio-manual" placeholder="FOLIO MANUAL..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-500 text-center uppercase outline-none focus:border-blue-500">
                    <button onclick="abrirChecklistManual()" class="bg-[#1a1f33] text-white px-5 rounded-xl hover:bg-slate-800 active:scale-95 transition-transform">
                        <i class="ph-bold ph-magnifying-glass text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- ==========================================
         VISTA 2: CHECKLIST
         ========================================== -->
    <main id="vista-checklist" class="p-4 hidden">
        <div class="flex items-center gap-4 mb-6 mt-2">
            <button onclick="volverARuta()" class="bg-white p-2 rounded-xl shadow-sm text-slate-600 border border-slate-200 active:scale-95"><i class="ph-bold ph-arrow-left text-xl"></i></button>
            <h2 class="font-black text-slate-800 text-lg uppercase tracking-tight">Inspección Física</h2>
        </div>

        <form id="formChecklist" onsubmit="event.preventDefault(); guardarChecklist();" class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
            <input type="hidden" id="chk-empresa-id">

            <div class="mb-6">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Folio / QR Activo</label>
                <input type="text" id="chk-qr" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-black text-slate-700 uppercase outline-none" required readonly>
            </div>

            <div class="mb-6">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-4 border-b border-slate-100 pb-2">Estado de Componentes</label>
                <div class="grid grid-cols-2 gap-x-4 gap-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-600 block mb-1">Manómetro</label>
                        <select id="chk-manometro" class="w-full p-3 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-700 outline-none"><option value="Bien">Bien</option><option value="Mal">Mal</option><option value="N/A">N/A</option></select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-600 block mb-1">Manguera</label>
                        <select id="chk-manguera" class="w-full p-3 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-700 outline-none"><option value="Bien">Bien</option><option value="Mal">Mal</option><option value="N/A">N/A</option></select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-600 block mb-1">Cilindro</label>
                        <select id="chk-cilindro" class="w-full p-3 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-700 outline-none"><option value="Bien">Bien</option><option value="Mal">Mal</option></select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-600 block mb-1">Seguro/Marchamo</label>
                        <select id="chk-seguro" class="w-full p-3 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-700 outline-none"><option value="Bien">Bien</option><option value="Mal">Falta/Roto</option></select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-600 block mb-1">Pintura</label>
                        <select id="chk-pintura" class="w-full p-3 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-700 outline-none"><option value="Bien">Bien</option><option value="Mal">Mal</option></select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-600 block mb-1">Señalética</label>
                        <select id="chk-senaletica" class="w-full p-3 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-700 outline-none"><option value="Bien">Bien</option><option value="Falta">Falta</option></select>
                    </div>
                </div>
            </div>

            <div class="mb-6">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Estatus Final</label>
                <select id="chk-estatus" class="w-full p-4 bg-white border border-[#10b981] rounded-xl text-sm font-black text-slate-800 outline-none" required>
                    <option value="Aprobado">🟢 APROBADO (Se queda en planta)</option>
                    <option value="Rechazado">🔴 RECHAZADO (A Taller)</option>
                    <option value="Condicionado">🟠 CONDICIONADO (Refacción)</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Observaciones</label>
                <textarea id="chk-observaciones" placeholder="Ej: Fuga detectada..." class="w-full p-4 bg-white border border-slate-200 rounded-xl text-xs font-medium h-24 outline-none focus:border-blue-500"></textarea>
            </div>

            <p id="msj-checklist" class="text-xs font-bold text-center mb-2 h-4"></p>

            <button type="submit" id="btnGuardarChecklist" class="w-full bg-[#10b981] text-white font-black py-4 rounded-xl hover:bg-emerald-600 transition shadow-md flex justify-center items-center gap-2 active:scale-95">
                <i class="ph-bold ph-check-circle text-xl"></i> GUARDAR INSPECCIÓN
            </button>
        </form>
    </main>

    <!-- MODAL DE LA CÁMARA PARA ESCANEAR -->
    <div id="modal-escaner" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-sm bg-white rounded-[2rem] overflow-hidden relative">
            <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                <h3 class="font-black text-sm uppercase">Cámara Activa</h3>
                <button onclick="cerrarEscaner()" class="text-red-400"><i class="ph-bold ph-x text-2xl"></i></button>
            </div>
            <div id="reader" width="100%"></div>
            <p class="text-center text-xs p-3 text-slate-500">Apunta la cámara al código QR del extintor.</p>
        </div>
    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around p-3 pb-6 z-40">
        <button onclick="volverARuta()" class="flex flex-col items-center text-[#203a85]">
            <i class="ph-bold ph-corners-out text-2xl mb-1"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">Auditar</span>
        </button>
        <!-- Le agregamos una alerta para que reaccione -->
        <button onclick="alert('Módulo de Inventario en construcción.')" class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition">
            <i class="ph-bold ph-fire-extinguisher text-2xl mb-1"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">Inventario</span>
        </button>
        <button onclick="cerrarSesion()" class="flex flex-col items-center text-slate-400 hover:text-red-500 transition">
            <i class="ph-bold ph-sign-out text-2xl mb-1"></i>
            <span class="text-[9px] font-black uppercase tracking-widest">Salir</span>
        </button>
    </nav>

    <script>
        const tecnicoId = localStorage.getItem('usuario_id');
        let idEmpresaActual = 0;
        let escanerActivo = null;

        if (!tecnicoId) window.location.href = 'index.html';

        // 1. CARGAR RUTA Y MARCADORES
        async function cargarRutaHoy() {
            try {
                const res = await fetch(`api/obtener_ruta_hoy.php?tecnico_id=${tecnicoId}`);
                const data = await res.json();
                
                if (data.error || !data.hay_ruta) {
                    document.getElementById('lbl-empresa').innerText = "Día Libre";
                    document.getElementById('lbl-direccion').innerText = "No hay rutas pendientes.";
                    return;
                }

                const ruta = data.datos;
                idEmpresaActual = ruta.empresa_id;
                
                // INYECTAMOS LOS DATOS A LA UI
                document.getElementById('chk-empresa-id').value = idEmpresaActual;
                document.getElementById('lbl-empresa').innerText = ruta.nombre_comercial;
                
                // Inyectamos los números a los marcadores visuales
                document.getElementById('lbl-avance-planta').innerText = `${ruta.auditados} / ${ruta.total_extintores}`;
                document.getElementById('lbl-avance-taller').innerHTML = `<i class="ph-bold ph-truck"></i> ${ruta.para_taller}`;

            } catch (e) {
                document.getElementById('lbl-empresa').innerText = "Error de red";
            }
        }

        // 2. NAVEGACIÓN Y BOTONES
        function abrirChecklistManual() {
            const folio = document.getElementById('input-folio-manual').value.trim();
            if(folio !== "") {
                document.getElementById('chk-qr').value = folio;
                document.getElementById('vista-principal').classList.add('hidden');
                document.getElementById('vista-checklist').classList.remove('hidden');
            } else {
                alert("Por favor, escribe un folio en la barra primero.");
            }
        }

        function volverARuta() {
            document.getElementById('vista-checklist').classList.add('hidden');
            document.getElementById('vista-principal').classList.remove('hidden');
            document.getElementById('input-folio-manual').value = "";
            cargarRutaHoy(); // Recarga los números al volver
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        // 3. CÁMARA
        function iniciarEscaner() {
            // Nota: Si estás probando sin certificado de seguridad (http normal) Chrome puede bloquear la cámara
            if (!window.isSecureContext && location.hostname !== "localhost") {
                alert("Nota: La cámara requiere conexión segura (HTTPS). Si falla, utiliza la barra manual.");
            }

            document.getElementById('modal-escaner').classList.remove('hidden');
            
            escanerActivo = new Html5Qrcode("reader");
            escanerActivo.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    // Si lee el código, cierra la cámara y abre el formulario
                    cerrarEscaner();
                    document.getElementById('chk-qr').value = decodedText;
                    document.getElementById('vista-principal').classList.add('hidden');
                    document.getElementById('vista-checklist').classList.remove('hidden');
                },
                (errorMessage) => { /* ignora errores de lectura mientras enfoca */ }
            ).catch((err) => {
                alert("Error: No se pudo abrir la cámara. Revisa los permisos de tu navegador.");
                cerrarEscaner();
            });
        }

        function cerrarEscaner() {
            document.getElementById('modal-escaner').classList.add('hidden');
            if(escanerActivo) {
                escanerActivo.stop().then(() => escanerActivo.clear()).catch(e => console.log(e));
            }
        }

        // 4. GUARDAR CHECKLIST
        async function guardarChecklist() {
            const btn = document.getElementById('btnGuardarChecklist');
            const msj = document.getElementById('msj-checklist');
            btn.disabled = true; btn.innerText = "GUARDANDO...";

            const payload = {
                tecnico_id: tecnicoId,
                empresa_id: document.getElementById('chk-empresa-id').value,
                qr: document.getElementById('chk-qr').value.trim(),
                manometro: document.getElementById('chk-manometro').value,
                manguera: document.getElementById('chk-manguera').value,
                cilindro: document.getElementById('chk-cilindro').value,
                seguro_marchamo: document.getElementById('chk-seguro').value,
                pintura: document.getElementById('chk-pintura').value,
                senaletica: document.getElementById('chk-senaletica').value,
                estatus: document.getElementById('chk-estatus').value,
                observaciones: document.getElementById('chk-observaciones').value
            };

            try {
                const res = await fetch('api/guardar_inspeccion.php', { method: 'POST', body: JSON.stringify(payload) });
                const data = await res.json();
                
                if (data.error) {
                    msj.innerText = data.mensaje; msj.style.color = "red";
                } else {
                    msj.innerText = "¡REGISTRADO CON ÉXITO!"; msj.style.color = "green";
                    document.getElementById('formChecklist').reset();
                    document.getElementById('chk-empresa-id').value = idEmpresaActual;
                    
                    setTimeout(() => { msj.innerText = ""; volverARuta(); }, 1500);
                }
            } catch (e) {
                msj.innerText = "Error de red."; msj.style.color = "red";
            } finally {
                btn.disabled = false; btn.innerHTML = `<i class="ph-bold ph-check-circle text-xl"></i> GUARDAR INSPECCIÓN`;
            }
        }

        document.addEventListener("DOMContentLoaded", cargarRutaHoy);
    </script>
</body>
</html>
